[workspace]
resolver = "2"
members = ["crates/canvas-core", "crates/canvas-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "js"] }

[profile.release]
opt-level = "s"
lto = true
